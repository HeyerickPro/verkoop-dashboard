<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heyerick Pro — Vertegenwoordiger Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
    --jdv:#3b82f6;--mac:#f59e0b;--text:#e8eaf0;--muted:#7b82a0;
    --green:#22c55e;--red:#ef4444;--orange:#f97316;--radius:12px;
    --font:'Inter',system-ui,sans-serif;--rep-color:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

  /* LOGIN */
  .login-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;}
  .login-logo{background:#fff;border-radius:16px;padding:20px 32px;}
  .login-logo img{height:56px;display:block;}
  .login-title{font-size:15px;color:var(--muted);text-align:center;}
  .rep-cards{display:flex;gap:20px;}
  .rep-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:28px 36px;cursor:pointer;text-align:center;transition:all .2s;min-width:150px;}
  .rep-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
  .rep-card.jdv:hover{border-color:var(--jdv);}
  .rep-card.mac:hover{border-color:var(--mac);}
  .rep-card.mgmt:hover{border-color:#a855f7;}
  .rep-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin:0 auto 10px;}
  .rep-avatar.jdv{background:rgba(59,130,246,.15);color:var(--jdv);}
  .rep-avatar.mac{background:rgba(245,158,11,.15);color:var(--mac);}
  .rep-avatar.mgmt{background:rgba(168,85,247,.15);color:#a855f7;}
  .rep-name{font-size:15px;font-weight:700;margin-bottom:3px;}
  .rep-sub{font-size:11px;color:var(--muted);}
  .login-screen.hidden{display:none;}

  /* HEADER */
  .header{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fff;}
  .header-left{display:flex;align-items:center;gap:16px;}
  .header-left img{height:44px;display:block;}
  .header-divider{width:1px;height:32px;background:#ddd;}
  .rep-badge{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;}
  .rep-badge.jdv{background:rgba(59,130,246,.15);color:var(--jdv);}
  .rep-badge.mac{background:rgba(245,158,11,.15);color:var(--mac);}
  .rep-badge.mgmt{background:rgba(168,85,247,.15);color:#a855f7;}
  .datebadge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted);}

  /* WINKEL BAR */
  .winkel-bar{display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--border);background:var(--surface);}
  .winkel-label{font-size:12px;color:var(--muted);margin-right:4px;}
  .wk-btn{padding:5px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--border);color:var(--muted);background:transparent;transition:all .15s;}
  .wk-btn.active{background:var(--rep-color);border-color:var(--rep-color);color:#fff;}
  .wk-btn.w-naz.active{background:#22c55e;border-color:#22c55e;color:#000;}
  .wk-btn.w-war.active{background:#a855f7;border-color:#a855f7;color:#fff;}

  /* TABS */
  .tabs{display:flex;gap:4px;padding:14px 24px 0;border-bottom:1px solid var(--border);}
  .tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--muted);background:transparent;transition:all .15s;}
  .tab:hover{color:var(--text);background:var(--surface);}
  .tab.active{color:var(--text);background:var(--surface);border-color:var(--border);}

  .main{padding:22px 24px;}
  .panel{display:none;}.panel.active{display:block;}

  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .kpi-grid.mgmt-grid{grid-template-columns:repeat(3,1fr);}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
  .kpi-val{font-size:22px;font-weight:700;line-height:1;color:var(--rep-color);}
  .kpi-row{display:flex;gap:16px;}
  .kpi-val-jdv{font-size:20px;font-weight:700;color:var(--jdv);}
  .kpi-val-mac{font-size:20px;font-weight:700;color:var(--mac);}
  .kpi-sub{font-size:10px;color:var(--muted);margin-top:2px;}

  /* CHARTS */
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .chart-card.full{grid-column:1/-1;}
  .chart-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--muted);}
  .chart-wrap{position:relative;height:210px;}.chart-wrap.tall{height:270px;}
  .refline{font-size:11px;color:var(--muted);margin-top:5px;}
  .refline span{color:var(--orange);font-weight:600;}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);cursor:pointer;}
  th:hover{color:var(--text);}
  td{padding:8px 12px;border-bottom:1px solid rgba(46,51,80,.45);}
  tr:hover td{background:var(--surface2);}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
  .badge-jdv{background:rgba(59,130,246,.15);color:var(--jdv);}
  .badge-mac{background:rgba(245,158,11,.15);color:var(--mac);}
  .badge-naz{background:rgba(34,197,94,.12);color:var(--green);}
  .badge-war{background:rgba(168,85,247,.12);color:#a855f7;}
  .badge-d{background:rgba(249,115,22,.15);color:var(--orange);font-size:10px;}
  .mc-low{color:var(--red);font-weight:600;}.mc-mid{color:var(--mac);font-weight:600;}
  .mc-ok{color:#84cc16;font-weight:600;}.mc-hi{color:var(--green);font-weight:600;}

  /* TOP10 */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .top10-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .top10-title{font-size:13px;font-weight:600;margin-bottom:12px;}
  .t10r{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(46,51,80,.4);font-size:12px;}
  .t10r:last-child{border-bottom:none;}
  .t10rk{color:var(--muted);font-size:11px;min-width:20px;}
  .t10rn{flex:1;padding:0 8px;}
  .t10rv{display:flex;gap:10px;text-align:right;}
  .t10ro{font-weight:600;min-width:72px;}
  .bar-bg{height:3px;background:var(--border);border-radius:2px;margin-top:2px;}
  .bar-fill{height:3px;border-radius:2px;}

  /* CONTROLS */
  .wk-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text);font-size:13px;cursor:pointer;}
  .search-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:13px;width:200px;outline:none;}
  .search-bar:focus{border-color:var(--rep-color);}
  .tbl-ctrl{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .tbl-scroll{max-height:450px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sec-title{font-size:15px;font-weight:700;}

  @media(max-width:700px){.kpi-grid,.two-col,.chart-row{grid-template-columns:1fr;}.main{padding:14px;}.rep-cards{flex-direction:column;}}
</style>
</head>

function mkChart(id,cfg){
  if(charts[id]){charts[id].destroy();}
  const ctx=document.getElementById(id);if(!ctx)return;
  const def={plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#7b82a0',font:{size:11}},grid:{color:'rgba(46,51,80,0.5)'}},y:{ticks:{color:'#7b82a0',font:{size:11}},grid:{color:'rgba(46,51,80,0.5)'}}}};
  charts[id]=new Chart(ctx,{...cfg,options:{responsive:true,maintainAspectRatio:false,...def,...(cfg.options||{})}});
}

// TABS per rol
const REP_TABS=['overzicht','maandanalyse','klanten','marge','transacties','yoy'];
const REP_TAB_LABELS=['📊 Overzicht','📅 Maandanalyse','👥 Top Klanten','💰 Marge','📋 Transacties','📈 Jaar-op-jaar'];
const MGMT_TABS=['overzicht','maandanalyse','klanten','marge','yoy'];
const MGMT_TAB_LABELS=['📊 Overzicht','📅 Maandanalyse','👥 Top Klanten','💰 Marge','📈 Jaar-op-jaar'];

function buildTabs(){
  const tabs = REP==='Management' ? MGMT_TABS : REP_TABS;
  const labels = REP==='Management' ? MGMT_TAB_LABELS : REP_TAB_LABELS;
  document.getElementById('tab-bar').innerHTML = tabs.map((t,i)=>
    `<div class="tab${i===0?' active':''}" onclick="showPanel('${t}')">${labels[i]}</div>`
  ).join('');
}

function startDashboard(rep){
  REP=rep;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('dashboard').style.display='block';
  document.documentElement.style.setProperty('--rep-color', REP_COLORS[rep]);
  document.getElementById('rep-badge-name').textContent=rep;
  document.getElementById('rep-badge').className='rep-badge '+(rep==='Joachim'?'jdv':rep==='Mathieu'?'mac':'mgmt');
  WINKEL='ALL'; D=ALLDATA.ALL;
  document.querySelectorAll('.wk-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  buildTabs();
  showPanel('overzicht');
}

function showLogin(){
  document.getElementById('dashboard').style.display='none';
  document.getElementById('login-screen').classList.remove('hidden');
  Object.values(charts).forEach(c=>c.destroy());
  Object.keys(charts).forEach(k=>delete charts[k]);
  // Clear panels
  ['overzicht','maandanalyse','klanten','marge','transacties'].forEach(p=>{
    document.getElementById('panel-'+p).innerHTML='';
  });
}

function setWinkel(wk,btn){
  WINKEL=wk; D=ALLDATA[wk];
  document.querySelectorAll('.wk-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  rerenderPanel(document.querySelector('.panel.active').id.replace('panel-',''));
}

function showPanel(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#tab-bar .tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  const tabs=REP==='Management'?MGMT_TABS:REP_TABS;
  const idx=tabs.indexOf(name);
  document.querySelectorAll('#tab-bar .tab')[idx]?.classList.add('active');
  rerenderPanel(name);
}

function rerenderPanel(name){
  if(REP==='Management'){
    if(name==='overzicht') renderMgmtOv();
    else if(name==='maandanalyse') renderMgmtMaand();
    else if(name==='klanten') renderMgmtTop10();
    else if(name==='marge') renderMgmtMarge();
    else if(name==='yoy') renderYoY();
  } else {
    if(name==='overzicht') renderRepOv();
    else if(name==='maandanalyse') renderRepMaand();
    else if(name==='klanten') renderRepTop10();
    else if(name==='marge') renderRepMarge();
    else if(name==='transacties'){fRows=D.detail.filter(r=>r.rep===REP);renderTable();}
    else if(name==='yoy') renderYoY();
  }
}

let sCol='dag',sAsc=false,fRows=[];
function renderTrans(){
  const p=document.getElementById('panel-transacties');
  p.innerHTML=`<div class="tbl-ctrl">
    <input class="search-bar" id="tbl-search" placeholder="Zoek klant..." oninput="filterTable()">
    <select class="wk-select" id="tbl-maand" onchange="filterTable()"><option value="ALL">Alle maanden</option>
    ${D.maanden.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
    <select class="wk-select" id="tbl-winkel" onchange="filterTable()">
      <option value="ALL">Alle winkels</option><option value="Nazareth">Nazareth</option><option value="Waregem">Waregem</option>
    </select>
    <select class="wk-select" id="tbl-marge" onchange="filterTable()">
      <option value="ALL">Alle marges</option><option value="LOW">Marge &lt;15%</option><option value="D100">Marge=100%</option>
    </select></div>
    <div class="tbl-scroll"><table>
      <thead><tr>
        <th onclick="srt('dag')">Datum ↕</th><th onclick="srt('maand')">Maand ↕</th>
        <th onclick="srt('klant')">Klant ↕</th><th onclick="srt('winkel')">Winkel ↕</th>
        <th onclick="srt('omzet')">Omzet ↕</th><th onclick="srt('marge')">Marge % ↕</th><th onclick="srt('winst')">Winst € ↕</th>
      </tr></thead>
      <tbody id="tbl-body"></tbody>
    </table></div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px;" id="tbl-count"></div>`;
  fRows=D.detail.filter(r=>r.rep===REP);
  renderTable();
}
function filterTable(){
  const q=document.getElementById('tbl-search')?.value.toLowerCase()||'';
  const maand=document.getElementById('tbl-maand')?.value||'ALL';
  const wink=document.getElementById('tbl-winkel')?.value||'ALL';
  const mf=document.getElementById('tbl-marge')?.value||'ALL';
  fRows=D.detail.filter(r=>r.rep===REP&&(maand==='ALL'||r.maand===maand)&&(wink==='ALL'||r.winkel===wink)&&(!q||r.klant.toLowerCase().includes(q))&&(mf==='ALL'||(mf==='LOW'&&r.marge<15)||(mf==='D100'&&r.flag100)));
  renderTable();
}
function srt(col){
  if(sCol===col)sAsc=!sAsc;else{sCol=col;sAsc=false;}
  fRows.sort((a,b)=>{let av=a[col],bv=b[col];if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}return sAsc?(av>bv?1:-1):(av<bv?1:-1);});
  renderTable();
}
function renderTable(){
  const tbody=document.getElementById('tbl-body'); if(!tbody)return;
  tbody.innerHTML=fRows.slice(0,250).map(r=>{
    const mdisp=r.flag100?'<span class="badge badge-d">dienst 100%</span>':`<span class="${r.marge<15?'mc-low':r.marge<20?'mc-mid':r.marge<24?'mc-ok':'mc-hi'}">${r.marge.toFixed(1)}%</span>`;
    return `<tr><td>${r.dag}</td><td>${r.maand}</td><td>${r.klant}</td>
      <td><span class="badge ${r.winkel==='Nazareth'?'badge-naz':'badge-war'}">${r.winkel}</span></td>
      <td style="font-weight:600">${f(r.omzet,2)}</td><td>${mdisp}</td><td>${f(r.winst,2)}</td></tr>`;
  }).join('');
  const el=document.getElementById('tbl-count'); if(el) el.textContent=`${fRows.length} transacties`;
}

          '<th data-col="orders26" onclick="sortYoY(this.dataset.col)">Orders 2026 ↕</th>' +
        '</tr></thead>' +
        '<tbody id="yoy-body"></tbody>' +
      '</table></div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:6px;" id="yoy-count"></div>' +
    '</div>';

  mkChart('c-yoy-maand',{type:'bar',data:{labels:maanden7,datasets:[
    {label:'2026',data:o26,backgroundColor:color+'c0',borderRadius:4},
    {label:'2025',data:o25,backgroundColor:'rgba(120,130,160,0.35)',borderRadius:4}
  ]},options:{plugins:{legend:{display:true,labels:{color:'#7b82a0',font:{size:11}}}}}});

  window._yoyData = yoyK;
  window._yoySCol = 'omzet26';
  window._yoySAsc = false;
  filterYoY();
}

function filterYoY(){
  var filter = (document.getElementById('yoy-filter')||{}).value||'ALL';
  var q = ((document.getElementById('yoy-search')||{}).value||'').toLowerCase();
  var rows = (window._yoyData||[]).slice();
  if(filter==='GROEI') rows = rows.filter(function(r){return r.omzet25>0 && r.omzet26>r.omzet25;});
  else if(filter==='DALING') rows = rows.filter(function(r){return r.omzet25>0 && r.omzet26<r.omzet25;});
  else if(filter==='NIEUW') rows = rows.filter(function(r){return r.omzet25===0 && r.omzet26>0;});
  else if(filter==='VERLOREN') rows = rows.filter(function(r){return r.omzet25>0 && r.omzet26===0;});
  if(q) rows = rows.filter(function(r){return r.klant.toLowerCase().indexOf(q)>=0;});
  var sc = window._yoySCol||'omzet26';
  var sa = window._yoySAsc||false;
  rows.sort(function(a,b){
    var av=a[sc], bv=b[sc];
    if(av===null||av===undefined) av=sa?Infinity:-Infinity;
    if(bv===null||bv===undefined) bv=sa?Infinity:-Infinity;
    return sa?(av>bv?1:-1):(av<bv?1:-1);
  });
  tekenYoY(rows);
}

function sortYoY(col){
  if(window._yoySCol===col) window._yoySAsc=!window._yoySAsc;
  else { window._yoySCol=col; window._yoySAsc=false; }
  filterYoY();
}

function tekenYoY(rows){
  var tbody = document.getElementById('yoy-body'); if(!tbody)return;
  tbody.innerHTML = rows.slice(0,200).map(function(r){
    var isNieuw = r.omzet25===0 && r.omzet26>0;
    var isVerloren = r.omzet25>0 && r.omzet26===0;
    var pos = r.groei_abs>0;
    var mc = isNieuw?'mc-hi':isVerloren?'mc-low':pos?'mc-hi':r.groei_abs<0?'mc-low':'';
    var pctDisplay = isNieuw?'<span class="badge" style="background:rgba(34,197,94,.15);color:var(--green);font-size:10px">Nieuw</span>':
                     isVerloren?'<span class="badge" style="background:rgba(239,68,68,.15);color:var(--red);font-size:10px">Verloren</span>':
                     r.groei_pct!==null&&r.groei_pct!==undefined?'<span class="'+mc+'">'+(r.groei_pct>0?'+':'')+r.groei_pct+'%</span>':'—';
    return '<tr>' +
      '<td>'+r.klant+'</td>' +
      '<td style="font-weight:600">'+(r.omzet26>0?f(r.omzet26):'—')+'</td>' +
      '<td style="color:var(--muted)">'+(r.omzet25>0?f(r.omzet25):'—')+'</td>' +
      '<td class="'+mc+'">'+(r.omzet25>0&&r.omzet26>0?(r.groei_abs>0?'+':'')+f(r.groei_abs):'—')+'</td>' +
      '<td>'+pctDisplay+'</td>' +
      '<td style="color:var(--muted)">'+(r.orders26||'—')+'</td>' +
    '</tr>';
  }).join('');
  var el = document.getElementById('yoy-count');
  if(el) el.textContent = rows.length+' klanten';
}



// ── MATHIEU MoM override ─────────────────────────────
const _origRenderYoY = renderYoY;
function renderYoY(){
  if(REP !== 'Mathieu'){ _origRenderYoY(); return; }
  var p = document.getElementById('panel-yoy');
  if(!p) return;
  var mom = D.mac_mom || [];
  if(!mom.length){
    p.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);">Geen data beschikbaar.</div>';
    return;
  }
  var mns = mom.map(function(m){return m.maand;});
  var omzets = mom.map(function(m){return m.omzet;});
  var orders_arr = mom.map(function(m){return m.orders;});
  var klanten_arr = mom.map(function(m){return m.klanten;});
  var avgs = mom.map(function(m){return m.avg_order;});
  var marges = mom.map(function(m){return m.marge;});
  var totaal = omzets.reduce(function(a,b){return a+b;},0);
  var tot_orders = orders_arr.reduce(function(a,b){return a+b;},0);
  var max_klanten = Math.max.apply(null,klanten_arr);

  p.innerHTML =
    '<div class="kpi-grid" style="margin-bottom:16px;">' +
      '<div class="kpi-card"><div class="kpi-label">Omzet mei–sep 2026</div><div class="kpi-val">'+f(totaal)+'</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">Totaal orders</div><div class="kpi-val">'+tot_orders+'</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">Max. actieve klanten</div><div class="kpi-val" style="color:var(--green)">'+max_klanten+'</div><div style="font-size:11px;color:var(--muted)">in één maand</div></div>' +
    '</div>' +
    '<div class="chart-row"><div class="chart-card full"><div class="chart-title">Maandelijkse omzet — evolutie mei–sep (€)</div><div class="chart-wrap tall"><canvas id="c-mom-omzet"></canvas></div></div></div>' +
    '<div class="chart-row">' +
      '<div class="chart-card"><div class="chart-title">Actieve klanten per maand</div><div class="chart-wrap"><canvas id="c-mom-klanten"></canvas></div></div>' +
      '<div class="chart-card"><div class="chart-title">Gem. orderwaarde per maand (€)</div><div class="chart-wrap"><canvas id="c-mom-avg"></canvas></div></div>' +
    '</div>' +
    '<div class="chart-row"><div class="chart-card full"><div class="chart-title">Gewogen marge % per maand — ref. 24%</div><div class="chart-wrap"><canvas id="c-mom-marge"></canvas></div><div class="refline">── Ref. = <b>24%</b></div></div></div>' +
    '<div class="chart-card full" style="margin-top:0;">' +
      '<div class="chart-title" style="margin-bottom:12px;">Alle klanten — overzicht</div>' +
      '<div class="tbl-ctrl"><input class="search-bar" id="mac-search" placeholder="Zoek klant..." oninput="filterMacKlanten()" style="width:200px;"></div>' +
      '<div class="tbl-scroll" style="max-height:360px;"><table>' +
        '<thead><tr>' +
          '<th data-col="omzet" onclick="sortMacKlanten(this.dataset.col)">Klant ↕</th>' +
          '<th data-col="omzet" onclick="sortMacKlanten(this.dataset.col)">Omzet ↕</th>' +
          '<th data-col="marge" onclick="sortMacKlanten(this.dataset.col)">Marge % ↕</th>' +
          '<th data-col="orders" onclick="sortMacKlanten(this.dataset.col)">Orders ↕</th>' +
        '</tr></thead>' +
        '<tbody id="mac-klanten-body"></tbody>' +
      '</table></div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:6px;" id="mac-klanten-count"></div>' +
    '</div>';

  mkChart('c-mom-omzet',{type:'bar',data:{labels:mns,datasets:[{label:'Omzet',data:omzets,backgroundColor:'#f59e0bb3',borderRadius:5}]}});
  mkChart('c-mom-klanten',{type:'bar',data:{labels:mns,datasets:[{label:'Klanten',data:klanten_arr,backgroundColor:'#22c55eb3',borderRadius:5}]}});
  mkChart('c-mom-avg',{type:'line',data:{labels:mns,datasets:[{label:'Gem. order',data:avgs,borderColor:'#f59e0b',tension:.3,pointRadius:5,fill:false}]}});
  mkChart('c-mom-marge',{type:'line',data:{labels:mns,datasets:[
    {label:'Marge %',data:marges,borderColor:'#f59e0b',tension:.3,pointRadius:5,fill:false},
    {label:'Ref. 24%',data:mns.map(function(){return 24;}),borderColor:'#f97316',borderDash:[5,4],borderWidth:1.5,pointRadius:0,fill:false}
  ]},options:{plugins:{legend:{display:true,labels:{color:'#7b82a0',font:{size:11}}}}}});

  window._macKlanten = D.top10['Mathieu'];
  window._macSCol = 'omzet';
  window._macSAsc = false;
  filterMacKlanten();
}

function filterMacKlanten(){
  var q=((document.getElementById('mac-search')||{}).value||'').toLowerCase();
  var rows=(window._macKlanten||[]).filter(function(r){return !q||r.klant.toLowerCase().indexOf(q)>=0;});
  rows.sort(function(a,b){
    var av=a[window._macSCol],bv=b[window._macSCol];
    return window._macSAsc?(av>bv?1:-1):(av<bv?1:-1);
  });
  var tbody=document.getElementById('mac-klanten-body'); if(!tbody)return;
  tbody.innerHTML=rows.map(function(r){
    var mc=r.marge<15?'mc-low':r.marge<20?'mc-mid':r.marge<24?'mc-ok':'mc-hi';
    return '<tr><td>'+r.klant+'</td><td style="font-weight:600">'+f(r.omzet)+'</td>'+
      '<td class="'+mc+'">'+r.marge.toFixed(1)+'%</td><td>'+r.orders+'x</td></tr>';
  }).join('');
  var el=document.getElementById('mac-klanten-count'); if(el) el.textContent=rows.length+' klanten';
}
function sortMacKlanten(col){
  if(window._macSCol===col)window._macSAsc=!window._macSAsc;else{window._macSCol=col;window._macSAsc=false;}
  filterMacKlanten();
}

window.addEventListener('load',function(){
  document.getElementById('upload-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
});
</script>
